<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NetHealth - Test de Hábitos Digitales</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="stile.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top py-3">

        <div class="container">

            <a
                class="navbar-brand fw-bold fs-4"
                href="index.html">

                NetHealth

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#customNavMenu"
                aria-controls="customNavMenu"
                aria-expanded="false"
                aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse justify-content-end"
                id="customNavMenu">

                <ul class="navbar-nav gap-lg-3 text-center">

                    <li class="nav-item">
                        <a
                            class="nav-link fs-5"
                            href="index.html">

                            Inicio

                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link fs-5"
                            href="conoce.html">

                            Conoce

                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link fs-5 active"
                            href="test.html">

                            Test

                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link fs-5"
                            href="recomendaciones.html">

                            Recomendaciones

                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= TEST ================= -->

    <main class="container py-5">

        <div class="text-center mb-5">

            <h1 class="fw-bold display-5">
                Test de Hábitos Digitales
            </h1>

            <p class="fs-5 text-muted">
                Responde con sinceridad. No existen respuestas
                correctas o incorrectas.
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-8">


                <!-- PROGRESO -->

                <div class="mb-4">

                    <div class="d-flex justify-content-between mb-2">

                        <span class="fw-bold">
                            Progreso
                        </span>

                        <span id="textoProgreso">
                            0 de 3
                        </span>

                    </div>

                    <div
                        class="progress"
                        role="progressbar"
                        aria-label="Progreso del test">

                        <div
                            id="barraProgreso"
                            class="progress-bar bg-dark"
                            style="width: 0%">
                        </div>

                    </div>

                </div>


                <!-- FORMULARIO -->

                <form
                    id="formTest"
                    class="card shadow p-4 test-card comment-box">


                    <!-- PREGUNTA 1 -->

                    <div class="question-card">

                        <label class="form-label fw-bold fs-5">

                            1. ¿Cuántas horas al día usas
                            el celular aproximadamente?

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p1"
                                value="1">

                            <span class="answer-content">

                                Menos de 2 horas

                            </span>

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p1"
                                value="2">

                            <span class="answer-content">

                                Entre 2 y 4 horas

                            </span>

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p1"
                                value="3">

                            <span class="answer-content">

                                Más de 4 horas

                            </span>

                        </label>

                    </div>


                    <!-- PREGUNTA 2 -->

                    <div class="question-card">

                        <label class="form-label fw-bold fs-5">

                            2. ¿Qué es lo primero que haces
                            al despertar?

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p2"
                                value="1">

                            <span class="answer-content">

                                Me levanto o hago mis rutinas
                                sin mirar el celular

                            </span>

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p2"
                                value="2">

                            <span class="answer-content">

                                Reviso la hora o mensajes
                                importantes rápidamente

                            </span>

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p2"
                                value="3">

                            <span class="answer-content">

                                Reviso redes sociales o
                                notificaciones de inmediato

                            </span>

                        </label>

                    </div>


                    <!-- PREGUNTA 3 -->

                    <div class="question-card">

                        <label class="form-label fw-bold fs-5">

                            3. ¿Sientes inquietud si te quedas
                            sin batería o sin internet?

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p3"
                                value="1">

                            <span class="answer-content">

                                Casi nunca me preocupa

                            </span>

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p3"
                                value="2">

                            <span class="answer-content">

                                A veces me resulta algo incómodo

                            </span>

                        </label>


                        <label class="answer-option">

                            <input
                                type="radio"
                                name="p3"
                                value="3">

                            <span class="answer-content">

                                Sí, me produce mucha inquietud

                            </span>

                        </label>

                    </div>


                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        class="btn btn-dark btn-lg w-100 fw-bold">

                        Obtener resultado

                    </button>

                </form>


                <!-- ================= RESULTADO ================= -->

                <div
                    id="resultadoTest"
                    class="mt-4 p-4 text-center shadow d-none">

                    <div
                        id="iconoResultado"
                        class="resultado-icon">
                    </div>

                    <h2
                        id="tituloResultado"
                        class="fw-bold">
                    </h2>

                    <p
                        id="descripcionResultado"
                        class="fs-5">
                    </p>

                    <a
                        href="recomendaciones.html"
                        class="btn btn-dark mt-2">

                        Ver recomendaciones

                    </a>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center py-4 mt-5">

        <p class="mb-0">

            NetHealth © 2026 |
            Concientización sobre el uso responsable
            de la tecnología

        </p>

    </footer>


    <button
        id="btnArriba"
        aria-label="Volver arriba">

        ↑

    </button>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- JavaScript -->

    <script src="java.js"></script>

</body>

</html>
